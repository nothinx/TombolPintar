sentence=Library tombol berbahasa Indonesia: debounce, klik, klik ganda, klik N kali, dan tekan lama.
paragraph=Non-blocking dan hanya 16 byte RAM per tombol. Debounce aktif sejak awal dan langsung bereaksi pada sentuhan pertama. Tekan lama berulang seperti tombol volume. Mendukung pull-up/pull-down internal, modul sentuh TTP223, tombol analog (LCD Keypad Shield), pin sentuh ESP32, dan sumber apa pun lewat perbarui(bool). Bekerja di AVR, ESP32, dan STM32. English: button debounce, click, double click, multi click, long press, auto repeat, low RAM.
